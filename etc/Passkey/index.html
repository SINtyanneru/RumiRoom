	<SCRIPT>
		function base64url_to_buffer(base64url) {
			const base64 = base64url.replace(/-/g, "+").replace(/_/g, "/");
			const padded = base64.padEnd(base64.length + (4 - base64.length % 4) % 4, "=");
			const binary = atob(padded);
			const buffer = new Uint8Array(binary.length);
			for (let i = 0; i < binary.length; i++) {
				buffer[i] = binary.charCodeAt(i);
			}
			return buffer.buffer;
		}

		function buffer_to_base64url(buffer) {
			const bytes = new Uint8Array(buffer);
			let binary = "";
			for (let i = 0; i < bytes.length; i++) {
				binary += String.fromCharCode(bytes[i]);
			}
			const base64 = btoa(binary);
			return base64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
		}

		async function regist() {
			const challenge = crypto.getRandomValues(new Uint8Array(32));
			const user_id = crypto.randomUUID();

			const public_key = {
				challenge: challenge,
				rp: {
					name: "rumi-room_etc_passkey",
					id: "etc.rumi-room.net"
				},
				user: {
					id: new TextEncoder().encode(user_id),
					name: "YOU",
					displayName: "貴様"
				},
				pubKeyCredParams: [
					//ES256
					{
						type: "public-key",
						alg: -7
					},
					//RS256
					{
						type: "public-key",
						alg: -257
					}
				],
				authenticatorSelection: {
					//内蔵認証器を優先
					authenticatorAttachment: "platform",
					//パスキーなのでrequired
					residentKey: "required",
					userVerification: "required"
				},
				timeout: 60000,
				attestation: "none"
			};

			const credential = await navigator.credentials.create({ publicKey: public_key });

			const result = {
				id: credential.id,
				rawId: buffer_to_base64url(credential.rawId),
				type: credential.type,
				response: {
					clientDataJSON: buffer_to_base64url(credential.response.clientDataJSON),
					attestationObject: buffer_to_base64url(credential.response.attestationObject)
				}
			};

			console.log(result);
		}
	</SCRIPT>
