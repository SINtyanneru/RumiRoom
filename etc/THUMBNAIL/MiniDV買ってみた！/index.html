<!DOCTYPE html>
<HTML>
	<HEAD>
		<TITLE>MiniDV買ってみた！</TITLE>

		<STYLE>
			.CANVAS{
				background-color: white;

				width: 1980px;
				height: 1080px;

				background-image: url("de24104a-71d3-4e64-8cdd-5e415d3f5bed.webp");
				background-repeat: no-repeat;
				background-position: center;
				background-size: cover;
			}

			.TITLE{
				font-size: 150px;
				background: linear-gradient(
					90deg,
					red,
					orange,
					yellow,
					green,
					cyan,
					blue,
					purple
				);
				background-clip: text;
				-webkit-text-fill-color: transparent;

				text-align: center;
				margin: auto;
			}

			.ALLOW{
				font-size: 200px;

				background: linear-gradient(
					90deg,
					red,
					orange,
					yellow,
					green,
					cyan,
					blue,
					purple
				);
				background-clip: text;
				-webkit-text-fill-color: transparent;

				/*width: fit-content;*/

				transform: translate(600px, 10px);
				transform: rotateZ(90deg);
			}
		</STYLE>
	</HEAD>
	<BODY>
		<DIV CLASS="CANVAS">
			<DIV CLASS="TITLE">新品のMiniDV買ってみた</DIV>

			<DIV CLASS="ALLOW">→</DIV>
		</DIV>
	</BODY>
</HTML>
